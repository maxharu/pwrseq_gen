[project]
name = "pwrseq_gen"
version = "1.5"
description = "Power Sequence Generator — GUI for editing power-sequence nodes and exporting Verilog/C/Draw.io/Schemdraw/Excel."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Haru" }]
dependencies = [
    "customtkinter>=5.2.0",
    "openpyxl>=3.1.0",
    "schemdraw>=0.19",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
build = ["pyinstaller>=6.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
