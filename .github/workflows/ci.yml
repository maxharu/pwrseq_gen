name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # 專案是 Windows 優先（.bat / .xlsm / PyInstaller），用同一個平台跑 ci.bat，
    # 本地與 CI 才不會各跑各的
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run CI
        run: .\ci.bat
